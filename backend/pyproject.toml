[project]
name = "keitaro-wrapper-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2", "fastapi>=0.115,<1", "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3",
  "Babel>=2.16,<3", "pycountry>=24.6,<25", "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.uv]
package = false

